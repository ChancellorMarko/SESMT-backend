name: sesmt
services:
  postgres:
    image: postgres:17-alpine
    container_name: sesmt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sesmt
      POSTGRES_PASSWORD: sesmt123
      POSTGRES_DB: sesmt
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sesmt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sesmt -d sesmt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
      build:
        context: .
        dockerfile: SESMT.API/Dockerfile
      container_name: sesmt_api
      restart: unless-stopped
      develop:
        watch:
          - action: rebuild
            path: ./SESMT.API
          - action: rebuild
            path: ./SESMT.Application
          - action: rebuild
            path: ./SESMT.Domain
          - action: rebuild
            path: ./SESMT.Infrastructure
      environment:
        ASPNETCORE_ENVIRONMENT: Development
        ConnectionStrings__Sesmt: "Host=postgres;Port=5432;Database=sesmt;Username=sesmt;Password=sesmt123"
        PasswordResetEmail__Host: "mailpit"           # nome do serviço
        PasswordResetEmail__Port: "1025"              # SMTP interno do mailpit
        PasswordResetEmail__EnableSsl: "false"
        PasswordResetEmail__From: "noreply@sesmt.local"
        PasswordResetEmail__Username: "sesmt"
        PasswordResetEmail__Password: "sesmt"
        PasswordResetEmail__ResetUrl: "http://localhost:5173/redefinir-senha"
      ports: 
        - "8080:8080"
      depends_on:
        postgres: {condition: service_healthy}
      networks:
        - sesmt

  mailpit:
      image: axllent/mailpit
      container_name: mailpit
      restart: unless-stopped
      volumes:
          - ./mailpit/data:/data
      ports:
          - 8025:8025
          - 1025:1025
      environment:
          MP_MAX_MESSAGES: 5000
          MP_DATABASE: /data/mailpit.db
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1

networks:
  sesmt:
    driver: bridge
    
volumes:
  postgres_data: